# A single large (damage 2000, r 4 m) explosion inside the top floor (floor 4, z 15.1-18.6) of the generated
# office: it punches a hole (chunks destroyed / small debris) but the building must stay up.
#   .venv/bin/python -m bgen.sim scenarios/office_top_blast.yaml
buildings:
  - {path: assets/buildings/office_1/building.bld, pos: [0, 0, 0], yaw: 0}
steps: 360
dt: 0.016666
ground: 0.0
actions:
  - {t: 0.5, explode: {center: [12.0, 7.5, 16.5], radius: 4.0, inner_radius: 1.5, damage: 2000, impulse: 3000}}
record: {out: runs/office_top_blast/, every: 4}
render: {camera: iso_ne, size: [960, 720], cutaway_z: 18.6}   # roof hidden: see the blast
expect: {collapse: false}
