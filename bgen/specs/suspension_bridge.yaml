# Two-tower suspension bridge: concrete deck with steel edge girders, portal-frame towers,
# parabolic main cables over the tower saddles down to anchorages, vertical hangers.
name: suspension_bridge
preset: structure
seed: 1
nodes:
  - sculpt:
      template: suspension_bridge
      layer: 0.5
      span: [95.0, 125.0]
      side_ratio: [0.35, 0.45]
      deck_z: [14.0, 18.0]
      width: [12.0, 15.0]
      tower_ratio: [0.15, 0.2]
      hanger_spacing: 5.0
      ground: {pad: 4.0}
# Cable / hanger joints concentrate the whole deck load: let reinforcement run longer.
stability: {max_rounds: 20, accept_util: 0.8}
