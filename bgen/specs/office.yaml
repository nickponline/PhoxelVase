# Mid-rise office: 4-6 floors, ribbon windows, storefront ground floor, columns on a 6 m grid.
name: office
preset: office
seed: 1234
global:
  floor_height: [3.4, 3.8]
  slab_thickness: 0.3
  ext_wall_thickness: 0.3
  int_wall_thickness: 0.15
blockout:
  shape: [rect, L, annex]
  width: [24, 36]
  depth: [14, 18]
  floors: [4, 6]
nodes:
  - floors: {}
  - exterior_walls: {bay_width: [3.0, 4.5], corner_rule: x_runs_through}
  - columns: {grid: 6.0, size: 0.5}
  - rooms: {strategy: bsp, min_room: 9.0, corridor: true, tags: {office: 0.6, meeting: 0.25, toilet: 0.15}}
  - stairs: {cores: 1, type: switchback}
  - openings: {windows: {style: ribbon, sill: 0.9, head: 2.6}, ground: {style: storefront}, doors: {per_room: 1}}
  - roofs: {flat: {parapet: 1.0}}
  - manual: {file: office.overrides.yaml}
fracture:
  concrete: {cell_size: 1.3, edge_bias: 1.5}
  brick: {cell_size: 1.0}
  glass: {mode: shatter_on_hit}
indestructible: [ground_slab]
