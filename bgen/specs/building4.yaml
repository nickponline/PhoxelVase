# building4: a very tall (~52 storey, ~190 m) setback skyscraper on a podium.
# Masses all start at ground; each floor is the union of masses that reach it, so the
# footprints nest: podium (4) > shaft (40) > upper tower (48) > crown (52).
name: building4
preset: tower
seed: 4
global:
  floor_height: 3.6
  slab_thickness: 0.3
  ext_wall_thickness: 0.35
  column_material: metal          # steel columns carry the height
blockout:
  - {footprint: [[0, 0], [40, 0], [40, 32], [0, 32]], floors: 4}             # podium
  - {footprint: [[7, 3], [33, 3], [33, 29], [7, 29]], floors: 40}            # main shaft
  - {footprint: [[10, 6], [30, 6], [30, 26], [10, 26]], floors: 48}          # setback
  - {footprint: [[14, 10], [26, 10], [26, 22], [14, 22]], floors: 52}        # crown
nodes:
  - floors: {}
  - exterior_walls: {bay_width: [3.0, 3.6]}
  - columns: {grid: 6.0, size: 0.8}
  - rooms: {min_room: 14.0, max_room: [40.0, 60.0]}
  - stairs: {cores: 1, type: switchback}
  - openings:
      windows: {style: ribbon, sill: 0.8, head: 3.0}
      ground: {style: storefront}
  - roofs: {flat: {parapet: 1.2}}
  - manual: {}
fracture:
  concrete: {cell_size: 2.0}
  brick: {cell_size: 1.5}
  metal: {cell_size: 1.8}
# At this height interior walls pick up load from the facade at every T-junction; the intact
# reinforced building still sits at utilization ~0.75: reinforce toward 0.5 but accept < 0.8.
stability: {accept_util: 0.8, max_rounds: 16}
