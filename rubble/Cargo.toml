[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rapier3d = { version = "0.36", features = ["parallel"] }
parry3d = "0.31"
rayon = "1"
slotmap = "1"
serde_yaml = "0.9"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

# Vendored parry3d 0.31.1 with performance-only patches (bit-identical results); see
# PERF.md ("Vendored parry3d").
[patch.crates-io]
parry3d = { path = "vendor/parry3d" }
