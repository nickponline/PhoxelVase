# Synthetic tower + wall: blow out the tower base, shoot the wall.
buildings:
  - {synthetic: {kind: tower, floors: 4, side: 6.0}, pos: [0, 0, 0], yaw: 0}
  - {synthetic: {kind: wall, w: 10.0, h: 6.0}, pos: [12, 0, 0], yaw: 0.3}
steps: 360
dt: 0.016666
actions:
  - {t: 0.5, explode: {center: [3, 3, 1.0], radius: 5, inner_radius: 4.5, damage: 100000, impulse: 20000}}
  - {t: 1.0, fire: {origin: [14, -20, 3], dir: [0, 1, 0], weapon: sniper, count: 10, rate: 10}}
  - {t: 2.0, damage: {building: 1, chunks: [0, 1, 2, 3], amount: 1.0e9}}
record: {transforms: true, events: true, out: runs/tower_collapse/, every: 2}
