[package]
name = "rubble-viewer"
edition.workspace = true
version.workspace = true
description = "Interactive Bevy viewer for rubble destruction worlds"

[[bin]]
name = "rubble-viewer"
path = "src/main.rs"

[dependencies]
rubble-core = { path = "../rubble-core" }
rubble-format = { path = "../rubble-format" }
serde.workspace = true
serde_yaml.workspace = true
bevy = { version = "0.19", default-features = false, features = ["3d", "ui", "default_font", "png", "tonemapping_luts"] }
